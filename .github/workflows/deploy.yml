# 自动部署：fork 的 main 有新提交就构建并发布到 Cloudflare Workers。
# 每天还会自动把上游 du2333/flare-stack-blog 的 main 合并进 fork，上游发版后无需手动同步。
#
# 与官方 docs/deployment.md 的 Cloudflare Workers Builds 等价：
#   Build command  -> bun run wrangler:prepare && bun run build
#   Deploy command -> bun run deploy
# 差别只是用 GitHub Actions 承载，构建变量取自本仓库 Secrets。
name: deploy to cloudflare workers

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - ".vscode/**"
      - ".github/ISSUE_TEMPLATE/**"
  schedule:
    # 每天 02:17 UTC，即北京时间 10:17，检查上游是否有新提交
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      sync_upstream:
        description: 先同步上游 main，再部署
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync-upstream:
    name: Sync upstream main
    if: >-
      github.event_name == 'schedule'
      || (github.event_name == 'workflow_dispatch' && github.event.inputs.sync_upstream == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.sync.outputs.changed }}
    steps:
      - name: Checkout fork main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Merge upstream main into fork main
        id: sync
        env:
          UPSTREAM_REPO: du2333/flare-stack-blog
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream "https://github.com/${UPSTREAM_REPO}.git"
          git fetch --no-tags upstream main

          FORK_SHA=$(git rev-parse HEAD)
          UP_SHA=$(git rev-parse upstream/main)
          echo "fork main = $FORK_SHA"
          echo "upstream  = $UP_SHA"

          if [ "$FORK_SHA" = "$UP_SHA" ] || git merge-base --is-ancestor "$UP_SHA" "$FORK_SHA"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "上游没有新提交，跳过同步与部署。"
            exit 0
          fi

          git merge --no-edit upstream/main
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "已把上游新提交合并进 fork main。"

      - name: Push merged main
        if: steps.sync.outputs.changed == 'true'
        run: git push origin HEAD:main

  deploy:
    name: Deploy
    needs: [sync-upstream]
    if: >-
      always() && !cancelled()
      && needs.sync-upstream.result != 'failure'
      && (github.event_name != 'schedule'
          || needs.sync-upstream.outputs.changed == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # --- 构建期必填：前两项必须与 Cloudflare 上的 Worker / Queue 名称一致 ---
      WORKER_NAME: my-blog
      QUEUE_NAME: blog-queue
      DOMAIN: 813146.xyz
      # --- 构建期必填：从本仓库 Secrets 读取（D1 / KV 填 ID，R2 填桶名） ---
      D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
      KV_NAMESPACE_ID: ${{ secrets.KV_NAMESPACE_ID }}
      BUCKET_NAME: ${{ secrets.BUCKET_NAME }}
      # --- 部署凭据 ---
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      # --- 可选：Umami 访问统计 ---
      # v2 里 VITE_UMAMI_WEBSITE_ID 是「构建期」变量（clientEnv() 读 import.meta.env，
      # 在构建时被 Vite 内联进产物），所以必须在这里注入，不能只设 Worker 运行期机密。
      # 值取自仓库 Settings → Secrets and variables → Actions → Variables。
      # 未设置时为空字符串，前端不会输出统计脚本（安全）。
      VITE_UMAMI_WEBSITE_ID: ${{ vars.VITE_UMAMI_WEBSITE_ID }}
      # --- 可选：Microsoft Clarity 访问统计 ---
      # 同样是构建期变量（同处 src/routes/_public/route.tsx 的 head 里注入）。
      VITE_CLARITY_PROJECT_ID: ${{ vars.VITE_CLARITY_PROJECT_ID }}
      # --- 部署后清边缘缓存用的管理 API Key（可选）---
      # 公开页面走 Workers Caching，边缘缓存 TTL 1 小时；不清的话部署后线上最长
      # 1 小时仍是旧 HTML，而旧 HTML 引用的 /assets/* 哈希已随新部署被替换。
      # 未配置时会跳过清缓存并告警，不影响部署本身。
      BLOG_API_KEY: ${{ secrets.BLOG_API_KEY }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun ci

      - name: Generate wrangler.jsonc
        run: bun run wrangler:prepare

      - name: Build
        run: bun run build

      # 构建期变量是被 Vite 内联进产物的，所以可以直接断言「到底有没有注入」。
      # 这比抓线上首页可靠：不受边缘缓存影响，也不会被「上一个版本还活着」迷惑。
      # 放在部署之前，配置写错就别白部署一次。
      - name: Verify analytics ids in build output
        run: |
          set -euo pipefail
          if [ ! -d dist ]; then
            echo "::warning::未找到 dist/ 构建产物目录，跳过产物断言"
            exit 0
          fi
          fail=0
          if [ -n "${VITE_UMAMI_WEBSITE_ID:-}" ]; then
            if grep -rqF "$VITE_UMAMI_WEBSITE_ID" dist; then
              echo "构建产物已内联 Umami website id"
            else
              echo "::error::构建产物里没有 Umami website id，VITE_UMAMI_WEBSITE_ID 未参与构建"
              fail=1
            fi
          else
            echo "未配置 VITE_UMAMI_WEBSITE_ID，跳过。"
          fi
          if [ -n "${VITE_CLARITY_PROJECT_ID:-}" ]; then
            if grep -rqF "$VITE_CLARITY_PROJECT_ID" dist; then
              echo "构建产物已内联 Clarity project id"
            else
              echo "::error::构建产物里没有 Clarity project id，VITE_CLARITY_PROJECT_ID 未参与构建"
              fail=1
            fi
          else
            echo "未配置 VITE_CLARITY_PROJECT_ID，跳过。"
          fi
          exit $fail

      # bun run deploy = bun db:migrate && wrangler deploy
      # 迁移是幂等的；Worker 已有的运行时变量与机密由 keep_vars 保留。
      - name: Migrate D1 and deploy Worker
        run: bun run deploy

      # 注意：这里比对的 package.json 版本号，所以「本次构建没有升版本」时它必然通过，
      # 并不能证明新版本已经生效 —— 真正等待新版本生效的是下面清缓存 + 首页校验那两步。
      - name: Verify live version
        run: |
          set -euo pipefail
          EXPECTED=$(python3 -c "import json;print(json.load(open('package.json'))['version'])")
          for i in $(seq 1 10); do
            BODY=$(curl -fsS "https://${DOMAIN}/api/spec.json" || true)
            GOT=$(printf '%s' "$BODY" | python3 -c "import json,sys;print(json.load(sys.stdin).get('info',{}).get('version',''))" 2>/dev/null || true)
            if [ "$GOT" = "$EXPECTED" ]; then
              echo "线上版本已是 $GOT"
              exit 0
            fi
            echo "第 $i 次：线上 ${GOT:-(取不到)}，期望 $EXPECTED，等待生效…"
            sleep 15
          done
          echo "线上版本未更新到 $EXPECTED"
          exit 1

      # 公开页面走 Workers Caching（见 src/server.ts 的 cf.cacheKey + wrangler 的 cache.enabled），
      # 响应头是 CDN-Cache-Control: public, max-age=3600, stale-while-revalidate=86400。
      # 也就是说部署完成后，边缘缓存里仍是「上一个版本」渲染出来的 HTML，最长 1 小时。
      # 那段旧 HTML 引用的是已随新部署被替换掉的 /assets/*.js|css 哈希，会让访客拿到
      # 没样式的页面；同时也会让下一步的线上校验读到旧内容而误报失败。
      # 这里用应用自带的清缓存接口（invalidate.all：全量失效 KV + 边缘缓存）把它刷掉。
      # 注意 workersCacheKey 会丢弃未知查询参数，所以 ?cb=xxx 这种破缓存手法是无效的。
      - name: Purge CDN cache so the new build goes live
        run: |
          set -euo pipefail
          if [ -z "${BLOG_API_KEY:-}" ]; then
            echo "::warning::未配置 BLOG_API_KEY，跳过清缓存；线上会在缓存过期前继续返回旧 HTML"
            exit 0
          fi
          CODE=""
          for i in 1 2 3; do
            CODE=$(curl -s -o /tmp/purge.json -w '%{http_code}' -X POST \
              -H "x-api-key: ${BLOG_API_KEY}" \
              -H 'Content-Type: application/json' \
              -H 'User-Agent: Mozilla/5.0' \
              --data '{}' "https://${DOMAIN}/api/admin/cache/invalidate" || true)
            echo "清缓存第 $i 次 -> HTTP ${CODE}  $(cat /tmp/purge.json 2>/dev/null)"
            [ "$CODE" = "200" ] && break
            sleep 5
          done
          if [ "$CODE" != "200" ]; then
            echo "::warning::清缓存未成功（HTTP ${CODE}），线上可能短时间仍返回旧 HTML"
            exit 0
          fi
          sleep 5   # 给边缘一点传播时间

      - name: Verify analytics wiring live
        run: |
          set -euo pipefail
          want_umami="${VITE_UMAMI_WEBSITE_ID:-}"
          want_clarity="${VITE_CLARITY_PROJECT_ID:-}"
          if [ -z "$want_umami" ] && [ -z "$want_clarity" ]; then
            echo "未配置任何统计 id，跳过线上校验。"
            exit 0
          fi

          # 1) /stats.js 由 Worker 代理到 ${UMAMI_SRC}/script.js；UMAMI_SRC 为空时是 404。
          #    这条不带缓存，判据干净。
          if [ -n "$want_umami" ]; then
            CODE=$(curl -s -o /tmp/stats.js -w '%{http_code}' "https://${DOMAIN}/stats.js" || true)
            echo "/stats.js -> HTTP ${CODE}  $(wc -c < /tmp/stats.js) 字节"
            if [ "$CODE" != "200" ]; then
              echo "UMAMI_SRC 未配置或 Umami 服务不可达（期望 200，实得 ${CODE}）"
              exit 1
            fi
          fi

          # 2) 首页应带上两个统计标记。缓存刚清过，但边缘传播仍可能滞后，所以带重试。
          #    取回细节：首页 HTML 含 NUL 字节（TanStack Start 的 SSR hydration payload，
          #    形如 "__root__\0"），bash 命令替换会丢弃并告警，先 tr -d '\0' 更干净；
          #    变量名不要用 HOME，那是 shell / setup-* action 依赖的特殊变量。
          #    Clarity 的 id 是作为参数出现在内联脚本末尾（"clarity", "script", "<id>"），
          #    所以不能按 clarity.ms/tag/<id> 去匹配，要分别匹配脚本入口和 id。
          ok=0
          for i in $(seq 1 15); do
            PAGE_HTML=$(curl -fsS -H 'Cache-Control: no-cache' "https://${DOMAIN}/" | tr -d '\0' || true)
            miss=""
            if [ -n "$want_umami" ]; then
              printf '%s' "$PAGE_HTML" | grep -qF "data-website-id=\"${want_umami}\"" || miss="${miss} umami"
            fi
            if [ -n "$want_clarity" ]; then
              { printf '%s' "$PAGE_HTML" | grep -qF "clarity.ms/tag/" \
                && printf '%s' "$PAGE_HTML" | grep -qF "${want_clarity}"; } || miss="${miss} clarity"
            fi
            if [ -z "$miss" ]; then
              echo "第 $i 次检查：首页已注入全部统计脚本。"
              ok=1
              break
            fi
            echo "第 $i 次检查：首页还缺${miss}，等待新版本传播…"
            sleep 6
          done
          if [ "$ok" != "1" ]; then
            echo "首页未出现期望的统计标记（umami=${want_umami:-未配置} clarity=${want_clarity:-未配置}）"
            exit 1
          fi

          # 3) Clarity 脚本入口可达性（软检查，只告警不失败）
          if [ -n "$want_clarity" ]; then
            CCODE=$(curl -s -o /dev/null -w '%{http_code}' -H 'User-Agent: Mozilla/5.0' \
              "https://www.clarity.ms/tag/${want_clarity}" || true)
            echo "clarity.ms/tag/${want_clarity} -> HTTP ${CCODE}"
            if [ "$CCODE" != "200" ]; then
              echo "::warning::Clarity 脚本入口未返回 200，请确认 project id 是否正确"
            fi
          fi
          echo "统计接线正常。"

